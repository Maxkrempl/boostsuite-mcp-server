[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boostsuite-mcp-server"
version = "1.0.0"
description = "BoostSuite MCP Server — website audit tools for AI agents with hybrid payment (x402 crypto + Stripe)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "HD Webdesign", email = "hercegdarko@hd-webdesign.si" }
]
keywords = ["mcp", "seo", "audit", "website", "ai-agent", "geo", "x402", "crypto", "accessibility", "security", "gdpr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://hd-webdesign.si/boostsuite/"
Repository = "https://github.com/hercegdarko/boostsuite-mcp-server"

[project.scripts]
boostsuite-mcp = "server:mcp.run"

[tool.hatch.build.targets.wheel]
packages = ["."]
